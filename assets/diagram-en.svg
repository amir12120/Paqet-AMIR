<svg xmlns="http://www.w3.org/2000/svg" width="760" height="300" viewBox="0 0 760 300" role="img" aria-label="paqet-panel on the panel host manages paqet-node on a remote server; local tunnels pair with node tunnels">
  <style>
    text { font-family: -apple-system, 'Segoe UI', Helvetica, Arial, sans-serif; }
    .title { font-size: 15px; font-weight: 600; fill: #8b949e; }
    .label { font-size: 15px; font-weight: 600; fill: #ffffff; }
    .mono { font-size: 15px; font-weight: 600; fill: #ffffff; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
    .edge { font-size: 13px; font-weight: 600; fill: #8b949e; }
  </style>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#8b949e"/>
    </marker>
  </defs>
  <rect x="20" y="16" width="300" height="268" rx="14" fill="#8b949e" fill-opacity="0.10" stroke="#8b949e" stroke-width="1.5"/>
  <text x="40" y="44" text-anchor="start" class="title">Panel host</text>
  <rect x="440" y="16" width="300" height="268" rx="14" fill="#8b949e" fill-opacity="0.10" stroke="#8b949e" stroke-width="1.5"/>
  <text x="460" y="44" text-anchor="start" class="title">Remote server</text>
  <line x1="170" y1="125" x2="170" y2="185" stroke="#8b949e" stroke-width="2"/>
  <line x1="590" y1="125" x2="590" y2="185" stroke="#8b949e" stroke-width="2"/>
  <line x1="270" y1="100" x2="486" y2="100" stroke="#8b949e" stroke-width="2" marker-end="url(#arrow)"/>
  <line x1="270" y1="210" x2="486" y2="210" stroke="#8b949e" stroke-width="2" stroke-dasharray="6 5" marker-end="url(#arrow)"/>
  <text x="380" y="90" text-anchor="middle" class="edge">manages</text>
  <text x="380" y="200" text-anchor="middle" class="edge">pair</text>
  <rect x="70" y="75" width="200" height="50" rx="10" fill="#2f6fd6" stroke="#ffffff" stroke-opacity="0.25"/>
  <text x="170" y="105" text-anchor="middle" class="mono">paqet-panel</text>
  <rect x="70" y="185" width="200" height="50" rx="10" fill="#1f8a70" stroke="#ffffff" stroke-opacity="0.25"/>
  <text x="170" y="215" text-anchor="middle" class="label">Local tunnels</text>
  <rect x="490" y="75" width="200" height="50" rx="10" fill="#2f6fd6" stroke="#ffffff" stroke-opacity="0.25"/>
  <text x="590" y="105" text-anchor="middle" class="mono">paqet-node</text>
  <rect x="490" y="185" width="200" height="50" rx="10" fill="#1f8a70" stroke="#ffffff" stroke-opacity="0.25"/>
  <text x="590" y="215" text-anchor="middle" class="label">Node tunnels</text>
</svg>
